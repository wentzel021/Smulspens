<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smul Spens - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .header h1 { margin: 0; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .stat-card h3 { margin: 0 0 10px; color: #666; }
    .stat-card .value { font-size: 28px; font-weight: bold; color: #2c3e50; }
    .section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .section h2 { margin-top: 0; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #f9f9f9;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #ddd;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    tr:hover { background: #f9f9f9; }
    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .status.pending { background: #fff3cd; color: #856404; }
    .status.paid { background: #d4edda; color: #155724; }
    .status.processing { background: #d1ecf1; color: #0c5460; }
    .status.shipped { background: #cfe2ff; color: #084298; }
    .status.delivered { background: #d1e7dd; color: #0f5132; }
    .button {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .button:hover { background: #0056b3; }
    .button.danger { background: #dc3545; }
    .button.danger:hover { background: #c82333; }
    .login-form {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .login-form h2 { text-align: center; }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginForm" class="login-form">
      <h2>Admin Login</h2>
      <div class="form-group">
        <label>Admin Token:</label>
        <input type="password" id="adminToken" placeholder="Enter admin token">
      </div>
      <button class="button" onclick="login()" style="width: 100%; padding: 12px;">Login</button>
    </div>

    <div id="dashboard" style="display: none;">
      <div class="header">
        <h1>Smul Spens Admin Dashboard</h1>
        <p>Order Management & Analytics</p>
        <button class="button" onclick="logout()" style="float: right; margin-top: -30px;">Logout</button>
      </div>

      <div class="stats" id="statsContainer"></div>

      <div class="section">
        <h2>Recent Orders</h2>
        <table id="ordersTable">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>

      <div class="section">
        <h2>Inventory</h2>
        <table id="inventoryTable">
          <thead>
            <tr>
              <th>Item</th>
              <th>Current Stock</th>
              <th>Reorder Level</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let authToken = localStorage.getItem('adminToken');

    function login() {
      const token = document.getElementById('adminToken').value;
      localStorage.setItem('adminToken', token);
      authToken = token;
      loadDashboard();
    }

    function logout() {
      localStorage.removeItem('adminToken');
      authToken = null;
      location.reload();
    }

    async function loadDashboard() {
      if (!authToken) return;
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      
      await Promise.all([
        loadStats(),
        loadOrders(),
        loadInventory()
      ]);
    }

    async function loadStats() {
      try {
        const res = await fetch(`${API_URL}/admin/stats`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const stats = await res.json();
        
        const html = `
          <div class="stat-card">
            <h3>Total Orders</h3>
            <div class="value">${stats.totalOrders || 0}</div>
          </div>
          <div class="stat-card">
            <h3>Paid Orders</h3>
            <div class="value">${stats.paidOrders || 0}</div>
          </div>
          <div class="stat-card">
            <h3>Pending Orders</h3>
            <div class="value">${stats.pendingOrders || 0}</div>
          </div>
          <div class="stat-card">
            <h3>Total Revenue</h3>
            <div class="value">R${(stats.totalRevenue || 0).toFixed(2)}</div>
          </div>
        `;
        document.getElementById('statsContainer').innerHTML = html;
      } catch (error) {
        console.error('Stats error:', error);
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${API_URL}/admin/orders`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const orders = await res.json();
        
        const html = orders.map(order => `
          <tr>
            <td>${order.id}</td>
            <td>${order.customerEmail || 'N/A'}</td>
            <td>${order.items.length} items</td>
            <td>R${order.total.toFixed(2)}</td>
            <td><span class="status ${order.status}">${order.status}</span></td>
            <td>${new Date(order.createdAt).toLocaleDateString()}</td>
            <td>
              <button class="button" onclick="viewOrder('${order.id}')">View</button>
              <button class="button" onclick="downloadInvoice('${order.id}')">Invoice</button>
            </td>
          </tr>
        `).join('');
        document.getElementById('ordersBody').innerHTML = html;
      } catch (error) {
        console.error('Orders error:', error);
      }
    }

    async function loadInventory() {
      try {
        const res = await fetch(`${API_URL}/admin/inventory`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const inventory = await res.json();
        
        const html = inventory.map(item => `
          <tr>
            <td>${item.itemName}</td>
            <td><input type="number" value="${item.quantity}" style="width: 80px;"></td>
            <td>${item.reorderLevel}</td>
            <td><button class="button" onclick="updateInventory('${item.itemId}')">Update</button></td>
          </tr>
        `).join('');
        document.getElementById('inventoryBody').innerHTML = html;
      } catch (error) {
        console.error('Inventory error:', error);
      }
    }

    function viewOrder(orderId) {
      alert('Order details for ' + orderId);
    }

    function downloadInvoice(orderId) {
      window.location.href = `${API_URL}/admin/orders/${orderId}/invoice`;
    }

    function updateInventory(itemId) {
      alert('Inventory updated for ' + itemId);
    }

    if (authToken) {
      loadDashboard();
    }
  </script>
</body>
</html>
